frr defaults traditional
hostname r3
service integrated-vtysh-config
log stdout
no zebra nexthop kernel enable
!
interface eth1
 ip address 198.18.0.10/30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 1
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface eth2
 ip address 198.18.0.14/30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 1
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface stub0
 ip address 10.10.4.1/24
 ip ospf area 0.0.0.0
 ip ospf passive
 ip ospf cost 1
!
router ospf
 ospf router-id 0.0.0.4
 maximum-paths 64
 timers throttle spf 100 200 1000
!
line vty
!
