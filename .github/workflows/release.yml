name: Binary distributions

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install Linux compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14
          echo 'CC=gcc-14' >> "$GITHUB_ENV"
          echo 'CXX=g++-14' >> "$GITHUB_ENV"
      - name: Install macOS compiler
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm@18
          echo "CXX=$(brew --prefix llvm@18)/bin/clang++" >> "$GITHUB_ENV"
          echo 'MACOSX_DEPLOYMENT_TARGET=15.0' >> "$GITHUB_ENV"
      - name: Configure without Python or tests
        run: |
          flags=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            flags+=('-DCMAKE_EXE_LINKER_FLAGS=-static-libgcc -static-libstdc++')
          fi
          cmake -S . -B build/distribution -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Python3=TRUE "${flags[@]}"
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^set(CPACK_PACKAGE_VERSION "\([^"]*\)")/\1/p' build/distribution/CPackConfig.cmake)
          test "$RELEASE_TAG" = "v$version"
      - name: Build, install and package
        run: |
          cmake --build build/distribution --parallel 4
          cmake --install build/distribution --prefix "$RUNNER_TEMP/routeproof staged"
          cpack --config build/distribution/CPackConfig.cmake -B "$RUNNER_TEMP/packages"
      - name: Test installed and archived binaries with the checkout hidden
        run: |
          python=$(command -v python3)
          cp tests/installation/check_install.py "$RUNNER_TEMP/check_install.py"
          hidden="$GITHUB_WORKSPACE.hidden"
          cd "$RUNNER_TEMP"
          mv "$GITHUB_WORKSPACE" "$hidden"
          trap 'mv "$hidden" "$GITHUB_WORKSPACE"' EXIT
          "$python" check_install.py --prefix "$RUNNER_TEMP/routeproof staged"
          for archive in packages/*.tar.gz; do
            "$python" check_install.py --archive "$archive"
          done
      - name: Preserve downloadable binaries and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: routeproof-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/packages/*.tar.gz
            ${{ runner.temp }}/packages/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: routeproof-*
          merge-multiple: true
          path: packages
      - name: Publish release archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd packages
          sha256sum --check ./*.sha256
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" ./*.tar.gz ./*.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false
