schema_version: 1
name: canonical-equivalence
model: ospf_spf_v1
routers:
  - {id: a, router_id: 0.0.0.1}
  - {id: b, router_id: 0.0.0.2}
  - {id: c, router_id: 0.0.0.3}
links:
  - {id: ab-1, a: a, b: b, cost_ab: 7, cost_ba: 9}
  - {id: ab-2, a: a, b: b, cost_ab: 11, cost_ba: 13, initial_state: down}
  - {id: bc, a: b, b: c, cost_ab: 2, cost_ba: 4}
prefixes:
  - {prefix: 10.8.0.0/24, origin: c, stub_cost: 3}
  - {prefix: 10.7.0.0/24, origin: a, stub_cost: 5}
  - {prefix: 10.9.0.3/32, origin: b, stub_cost: 7}
events:
  - {id: take-ab-2-up, seq: 1, at_ns: 10, type: link_up, link: ab-2}
  - {id: take-c-down, seq: 2, at_ns: 20, type: router_down, router: c}
assertions:
  - {id: a-to-c, type: must_reach, source: a, destination: 10.8.0.5, quantifier: all, scope: every_snapshot}
  - {id: a-to-b, type: must_reach, source: a, destination: 10.9.0.3, quantifier: all, scope: every_snapshot}
  - {id: c-to-a, type: must_reach, source: c, destination: 10.7.0.42, quantifier: all, scope: every_snapshot}
